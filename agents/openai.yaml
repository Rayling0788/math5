interface:
  display_name: "数学建模增量交付"
  short_description: "MATLAB 建模、证据型图表、保真自然中文论文和终稿验收"
  default_prompt: "使用 $1start-mathmodel 完成 MATLAB 建模与中文论文；先审计独立评价单位、数据泄漏、标签与指标语义，再选择与样本量匹配的模型；按当前比赛官方格式组织摘要、正文、附录和支撑包，用真实模型图、场景结果表和验证图形成证据链。写作时冻结数值、单位、公式、场景与结论强度，以具体对象和推导动作组织自然、克制的中文学术表达，清除聊天式修改痕迹和无证据拔高，最后执行增量复现、编译和逐页验收。"

policy:
  allow_implicit_invocation: true
